name: Publish GHCR image from Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release and Git tag to rebuild
        required: true
        type: string

permissions: {}

concurrency:
  group: ghcr-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/6789ai/6789-aigateway

jobs:
  prepare:
    name: Resolve Release source and image tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      alias: ${{ steps.version.outputs.alias }}
      raw_tag: ${{ steps.version.outputs.raw_tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository metadata
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve and validate Release
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RAW_TAG="$INPUT_TAG"
          else
            RAW_TAG="$RELEASE_TAG"
          fi

          VERSION="$RAW_TAG"
          if [[ "$VERSION" == v* ]]; then
            VERSION="${VERSION#v}"
          fi
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker tag after removing the optional v prefix: '$VERSION'"
            exit 1
          fi

          gh release view "$RAW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          if ! git rev-parse --verify --quiet "refs/tags/$RAW_TAG^{commit}" >/dev/null; then
            echo "::error::Git tag '$RAW_TAG' does not exist or does not resolve to a commit"
            exit 1
          fi

          LOWER_VERSION="${VERSION,,}"
          if [[ "$LOWER_VERSION" =~ (^|[._-])alpha([._-]|[0-9]|$) ]]; then
            ALIAS="alpha-latest"
          else
            ALIAS="latest"
          fi

          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "raw_tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse "refs/tags/$RAW_TAG^{commit}")" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $IMAGE_NAME:$VERSION and $IMAGE_NAME:$ALIAS from Release $RAW_TAG"

  build:
    name: Build and push (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out Release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Write build version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: printf '%s\n' "$VERSION" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
          cache-from: type=gha,scope=docker-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-release-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

  manifest:
    name: Publish multi-arch manifests
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and inspect manifests
        shell: bash
        env:
          ALIAS: ${{ needs.prepare.outputs.alias }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$VERSION" \
            "$IMAGE_NAME:$VERSION-amd64" \
            "$IMAGE_NAME:$VERSION-arm64"
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$ALIAS" \
            "$IMAGE_NAME:$VERSION-amd64" \
            "$IMAGE_NAME:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE_NAME:$VERSION"

      - name: Write summary
        shell: bash
        env:
          ALIAS: ${{ needs.prepare.outputs.alias }}
          RAW_TAG: ${{ needs.prepare.outputs.raw_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "### Published GHCR image"
            echo
            echo "- Release: \`$RAW_TAG\`"
            echo "- \`$IMAGE_NAME:$VERSION\`"
            echo "- \`$IMAGE_NAME:$ALIAS\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"

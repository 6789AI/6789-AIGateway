name: Publish GHCR image from DOCKERVERSION

on:
  push:
    branches:
      - main
    paths:
      - DOCKERVERSION
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag; the optional leading v is removed
        required: true
        type: string

permissions: {}

concurrency:
  group: ghcr-version-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/6789ai/6789-aigateway

jobs:
  prepare:
    name: Resolve source and image tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      alias: ${{ steps.version.outputs.alias }}
      should_build: ${{ steps.version.outputs.should_build }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.sha }}

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RAW_TAG="$INPUT_TAG"
          else
            mapfile -t version_lines < DOCKERVERSION
            if (( ${#version_lines[@]} == 0 )); then
              echo "DOCKERVERSION is empty; skipping image publication."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if (( ${#version_lines[@]} != 1 )); then
              echo "::error::DOCKERVERSION must contain exactly one line"
              exit 1
            fi
            RAW_TAG="${version_lines[0]%$'\r'}"
            if [[ -z "${RAW_TAG//[[:space:]]/}" ]]; then
              echo "DOCKERVERSION is empty; skipping image publication."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          VERSION="$RAW_TAG"
          if [[ "$VERSION" == v* ]]; then
            VERSION="${VERSION#v}"
          fi
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker tag after removing the optional v prefix: '$VERSION'"
            exit 1
          fi

          LOWER_VERSION="${VERSION,,}"
          if [[ "$LOWER_VERSION" =~ (^|[._-])alpha([._-]|[0-9]|$) ]]; then
            ALIAS="alpha-latest"
          else
            ALIAS="latest"
          fi

          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $IMAGE_NAME:$VERSION and $IMAGE_NAME:$ALIAS"

  build:
    name: Build and push (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Write build version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: printf '%s\n' "$VERSION" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
          cache-from: type=gha,scope=docker-version-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-version-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

  manifest:
    name: Publish multi-arch manifests
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and inspect manifests
        shell: bash
        env:
          ALIAS: ${{ needs.prepare.outputs.alias }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$VERSION" \
            "$IMAGE_NAME:$VERSION-amd64" \
            "$IMAGE_NAME:$VERSION-arm64"
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$ALIAS" \
            "$IMAGE_NAME:$VERSION-amd64" \
            "$IMAGE_NAME:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE_NAME:$VERSION"

      - name: Write summary
        shell: bash
        env:
          ALIAS: ${{ needs.prepare.outputs.alias }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "### Published GHCR image"
            echo
            echo "- \`$IMAGE_NAME:$VERSION\`"
            echo "- \`$IMAGE_NAME:$ALIAS\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"

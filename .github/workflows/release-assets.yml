name: Publish Release assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release and Git tag to rebuild
        required: true
        type: string

permissions: {}

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      raw_tag: ${{ steps.version.outputs.raw_tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository metadata
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve and validate Release
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RAW_TAG="$INPUT_TAG"
          else
            RAW_TAG="$RELEASE_TAG"
          fi

          VERSION="$RAW_TAG"
          if [[ "$VERSION" == v* ]]; then
            VERSION="${VERSION#v}"
          fi
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid release asset version after removing the optional v prefix: '$VERSION'"
            exit 1
          fi

          gh release view "$RAW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          if ! git rev-parse --verify --quiet "refs/tags/$RAW_TAG^{commit}" >/dev/null; then
            echo "::error::Git tag '$RAW_TAG' does not exist or does not resolve to a commit"
            exit 1
          fi

          echo "raw_tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse "refs/tags/$RAW_TAG^{commit}")" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  frontend:
    name: Build frontend dist
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
          VITE_REACT_APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: bun run build

      - name: Package frontend dist
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: tar -czf "6789-aigateway-web-dist-$VERSION.tar.gz" -C web dist

      - name: Upload frontend for backend builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload frontend Release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-release
          path: 6789-aigateway-web-dist-${{ needs.prepare.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - prepare
      - frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            basename: 6789-aigateway-linux-amd64
            extension: ''
          - goos: linux
            goarch: arm64
            basename: 6789-aigateway-linux-arm64
            extension: ''
          - goos: darwin
            goarch: amd64
            basename: 6789-aigateway-darwin-amd64
            extension: ''
          - goos: darwin
            goarch: arm64
            basename: 6789-aigateway-darwin-arm64
            extension: ''
          - goos: windows
            goarch: amd64
            basename: 6789-aigateway-windows-amd64
            extension: .exe
    steps:
      - name: Check out Release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build backend
        shell: bash
        env:
          CGO_ENABLED: '0'
          EXTENSION: ${{ matrix.extension }}
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
          GOWORK: 'off'
          OUTPUT_BASENAME: ${{ matrix.basename }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          OUTPUT_NAME="$OUTPUT_BASENAME-$VERSION$EXTENSION"
          go build -trimpath \
            -ldflags "-s -w -X github.com/QuantumNous/new-api/common.Version=$VERSION" \
            -o "release-assets/$OUTPUT_NAME" .

      - name: Upload backend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Upload assets to GitHub Release
    needs:
      - prepare
      - frontend
      - backend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download frontend Release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-release
          path: release-assets

      - name: Download backend assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Generate and verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          LC_ALL=C sha256sum 6789-aigateway-* > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_TAG: ${{ needs.prepare.outputs.raw_tag }}
        run: gh release upload "$RAW_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Write summary
        shell: bash
        env:
          RAW_TAG: ${{ needs.prepare.outputs.raw_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "### Published Release assets"
            echo
            echo "- Release: \`$RAW_TAG\`"
            echo "- Version in filenames: \`$VERSION\`"
            echo "- Frontend dist plus Linux, macOS, and Windows binaries"
            echo "- SHA-256 manifest: \`SHA256SUMS.txt\`"
          } >> "$GITHUB_STEP_SUMMARY"

#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = ".air"

[build]
pre_cmd = ["go run ./cmd/ensure-dev-assets"]
cmd = "go build -o ./.air/new-api-dev ."
entrypoint = ["./.air/new-api-dev"]
include_ext = ["go"]
exclude_dir = [
  ".air",
  ".git",
  ".gocache",
  ".gocache-temp",
  ".gomodcache",
  ".gopath",
  "data",
  "docs",
  "vendor",
  "web",
]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = 500000000

[build.windows]
pre_cmd = ["go.exe run ./cmd/ensure-dev-assets"]
cmd = "go build -o ./.air/new-api-dev.exe ."
entrypoint = [".air\\new-api-dev.exe"]

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
